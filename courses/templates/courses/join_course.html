{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">

    <title>Join Course | MetroClass</title>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark" style="background-color: #14194B;">
        <div class="container">
            <a href="{% url 'dashboard' %}" class="navbar-brand d-flex align-items-center">
                <img src="{% static 'core/images/logo.png' %}" alt="MetroClass logo" height="38" class="bg-white border border-white rounded p-1">
            </a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="h2 fw-bold mb-2">Join a course</h1>
                        <p class="text-muted mb-4">Ask your Teacher for the six-character course code.</p>

                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="{{ form.course_code.id_for_label }}" class="form-label fw-semibold">
                                    Course code
                                </label>
                                {{ form.course_code }}
                                {% for error in form.course_code.errors %}
                                    <div class="text-danger small mt-1">{{ error }}</div>
                                {% endfor %}
                            </div>

                            <button type="submit" class="btn text-white w-100" style="background-color: #EA1D22;">
                                Join Course
                            </button>
                        </form>

                        <p class="text-center mt-4 mb-0">
                            <a href="{% url 'dashboard' %}" class="text-decoration-none">Back to dashboard</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
